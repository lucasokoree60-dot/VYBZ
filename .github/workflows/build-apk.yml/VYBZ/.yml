name: Build VYBZ APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract VYBZ project
        run: unzip -o VYBZ_Android_Studio_Project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p VYBZ_Android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VYBZ-APK
          path: VYBZ_Android/app/build/outputs/apk/debug/app-debug.apk
